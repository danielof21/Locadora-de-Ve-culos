<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <rect width="1200" height="820" fill="#f1f5f9"/>
  <!-- Top Navbar Wireframe -->
  <rect x="20" y="20" width="1160" height="56" rx="8" fill="#1e293b"/>
  <text x="40" y="54" fill="#ffffff" font-family="Segoe UI, Arial" font-size="18" font-weight="bold">WIREFRAME - Sistema de Gestao de Locadora de Veiculos (TP1 e TP2)</text>
  <rect x="580" y="32" width="110" height="32" rx="6" fill="#2563eb"/>
  <text x="595" y="53" fill="#ffffff" font-family="Segoe UI, Arial" font-size="12" font-weight="bold">Visao Geral</text>
  <rect x="700" y="32" width="130" height="32" rx="6" fill="#334155"/>
  <text x="712" y="53" fill="#cbd5e1" font-family="Segoe UI, Arial" font-size="12">Consultas (JOIN)</text>
  <rect x="840" y="32" width="100" height="32" rx="6" fill="#334155"/>
  <text x="862" y="53" fill="#cbd5e1" font-family="Segoe UI, Arial" font-size="12">Clientes</text>
  <rect x="950" y="32" width="100" height="32" rx="6" fill="#334155"/>
  <text x="972" y="53" fill="#cbd5e1" font-family="Segoe UI, Arial" font-size="12">Veiculos</text>
  <rect x="1060" y="32" width="100" height="32" rx="6" fill="#334155"/>
  <text x="1082" y="53" fill="#cbd5e1" font-family="Segoe UI, Arial" font-size="12">Alugueis</text>

  <!-- KPI Row -->
  <rect x="20" y="92" width="180" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="36" y="118" fill="#64748b" font-family="Segoe UI, Arial" font-size="12">Clientes Cadastrados</text>
  <text x="36" y="152" fill="#0f172a" font-family="Segoe UI, Arial" font-size="24" font-weight="bold">06</text>

  <rect x="216" y="92" width="180" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="232" y="118" fill="#64748b" font-family="Segoe UI, Arial" font-size="12">Frota de Veiculos</text>
  <text x="232" y="152" fill="#0f172a" font-family="Segoe UI, Arial" font-size="24" font-weight="bold">08</text>

  <rect x="412" y="92" width="180" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="428" y="118" fill="#64748b" font-family="Segoe UI, Arial" font-size="12">Veiculos Disponiveis</text>
  <text x="428" y="152" fill="#16a34a" font-family="Segoe UI, Arial" font-size="24" font-weight="bold">05</text>

  <rect x="608" y="92" width="180" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="624" y="118" fill="#64748b" font-family="Segoe UI, Arial" font-size="12">Locacoes Ativas</text>
  <text x="624" y="152" fill="#ca8a04" font-family="Segoe UI, Arial" font-size="24" font-weight="bold">03</text>

  <rect x="804" y="92" width="180" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="820" y="118" fill="#64748b" font-family="Segoe UI, Arial" font-size="12">Fabricantes / Cat.</text>
  <text x="820" y="152" fill="#0f172a" font-family="Segoe UI, Arial" font-size="24" font-weight="bold">07 / 05</text>

  <rect x="1000" y="92" width="180" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1016" y="118" fill="#64748b" font-family="Segoe UI, Arial" font-size="12">Receita Consolidada</text>
  <text x="1016" y="152" fill="#16a34a" font-family="Segoe UI, Arial" font-size="22" font-weight="bold">R$ 2.640,00</text>

  <!-- Left Panel: CRUD & Multi-Filter Wireframe -->
  <rect x="20" y="190" width="740" height="310" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="40" y="222" fill="#0f172a" font-family="Segoe UI, Arial" font-size="16" font-weight="bold">TELA CRUD + PESQUISA COM FILTROS PERSONALIZADOS (&gt;= 2 CAMPOS)</text>
  <rect x="610" y="202" width="130" height="32" rx="6" fill="#16a34a"/>
  <text x="626" y="222" fill="#ffffff" font-family="Segoe UI, Arial" font-size="12" font-weight="bold">+ Novo Registro</text>

  <!-- Filter Bar -->
  <rect x="40" y="242" width="700" height="58" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="52" y="254" width="160" height="32" rx="4" fill="#ffffff" stroke="#94a3b8"/>
  <text x="62" y="274" fill="#64748b" font-family="Segoe UI, Arial" font-size="11">Filtro Campo 1 (Nome/Modelo)</text>
  <rect x="224" y="254" width="160" height="32" rx="4" fill="#ffffff" stroke="#94a3b8"/>
  <text x="234" y="274" fill="#64748b" font-family="Segoe UI, Arial" font-size="11">Filtro Campo 2 (FK/Status)</text>
  <rect x="396" y="254" width="150" height="32" rx="4" fill="#ffffff" stroke="#94a3b8"/>
  <text x="406" y="274" fill="#64748b" font-family="Segoe UI, Arial" font-size="11">Filtro Campo 3 (Ano/KM)</text>
  <rect x="558" y="254" width="90" height="32" rx="4" fill="#2563eb"/>
  <text x="578" y="274" fill="#ffffff" font-family="Segoe UI, Arial" font-size="11" font-weight="bold">Pesquisar</text>
  <rect x="656" y="254" width="70" height="32" rx="4" fill="#e2e8f0"/>
  <text x="673" y="274" fill="#475569" font-family="Segoe UI, Arial" font-size="11">Limpar</text>

  <!-- Table Rows -->
  <rect x="40" y="314" width="700" height="32" fill="#f1f5f9"/>
  <text x="52" y="334" fill="#475569" font-family="Segoe UI, Arial" font-size="11" font-weight="bold">ID | DADOS PRINCIPAIS DA ENTIDADE | CHAVES ESTRANGEIRAS | STATUS | ACOES (EDITAR / EXCLUIR)</text>
  <rect x="40" y="346" width="700" height="42" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="52" y="371" fill="#1e293b" font-family="Segoe UI, Arial" font-size="12">#1   Corolla XEi 2.0 Flex   |   Toyota   |   Sedan Executivo   |   2024   |   12.400 km</text>
  <rect x="590" y="355" width="64" height="24" rx="4" fill="#2563eb"/>
  <text x="606" y="371" fill="#ffffff" font-family="Segoe UI, Arial" font-size="11">Editar</text>
  <rect x="662" y="355" width="64" height="24" rx="4" fill="#dc2626"/>
  <text x="676" y="371" fill="#ffffff" font-family="Segoe UI, Arial" font-size="11">Excluir</text>

  <rect x="40" y="388" width="700" height="42" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="52" y="413" fill="#1e293b" font-family="Segoe UI, Arial" font-size="12">#2   T-Cross Highline 250   |   Volkswagen   |   SUV Compacto   |   2024   |   8.900 km</text>
  <rect x="590" y="397" width="64" height="24" rx="4" fill="#2563eb"/>
  <text x="606" y="413" fill="#ffffff" font-family="Segoe UI, Arial" font-size="11">Editar</text>
  <rect x="662" y="397" width="64" height="24" rx="4" fill="#dc2626"/>
  <text x="676" y="413" fill="#ffffff" font-family="Segoe UI, Arial" font-size="11">Excluir</text>

  <!-- Right Panel: Modal CRUD Wireframe -->
  <rect x="780" y="190" width="400" height="310" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <rect x="780" y="190" width="400" height="44" rx="10" fill="#1e293b"/>
  <text x="800" y="217" fill="#ffffff" font-family="Segoe UI, Arial" font-size="14" font-weight="bold">MODAL: Cadastrar / Editar Registro (POST / PUT)</text>
  <text x="800" y="260" fill="#334155" font-family="Segoe UI, Arial" font-size="12" font-weight="bold">Campo Principal / Nome / Modelo *</text>
  <rect x="800" y="268" width="360" height="32" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="800" y="322" fill="#334155" font-family="Segoe UI, Arial" font-size="12" font-weight="bold">Selecao de Chave Estrangeira (FK) *</text>
  <rect x="800" y="330" width="360" height="32" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="800" y="384" fill="#334155" font-family="Segoe UI, Arial" font-size="12" font-weight="bold">Valores Numericos / Datas *</text>
  <rect x="800" y="392" width="360" height="32" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
  <rect x="940" y="446" width="100" height="34" rx="6" fill="#64748b"/>
  <text x="965" y="468" fill="#ffffff" font-family="Segoe UI, Arial" font-size="12">Cancelar</text>
  <rect x="1050" y="446" width="110" height="34" rx="6" fill="#2563eb"/>
  <text x="1085" y="468" fill="#ffffff" font-family="Segoe UI, Arial" font-size="12" font-weight="bold">Salvar</text>

  <!-- Bottom Panel: Etapa 3 JOIN Queries & Charts Wireframe -->
  <rect x="20" y="520" width="1160" height="280" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="40" y="552" fill="#0f172a" font-family="Segoe UI, Arial" font-size="16" font-weight="bold">PAINEL DE CONSULTAS RELACIONAIS E VISUALIZACOES (ROTAS DA 3a ETAPA - FiltrosController)</text>

  <rect x="40" y="570" width="540" height="210" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="596" fill="#1e40af" font-family="Consolas, monospace" font-size="13" font-weight="bold">GET /api/filtros/veiculos-disponiveis?categoriaId=&amp;anoMinimo=</text>
  <rect x="56" y="608" width="508" height="54" rx="6" fill="#0f172a"/>
  <text x="68" y="630" fill="#38bdf8" font-family="Consolas, monospace" font-size="11">SELECT v.*, f.Nome, c.Nome FROM Veiculos v INNER JOIN Categorias c...</text>
  <text x="68" y="648" fill="#e2e8f0" font-family="Consolas, monospace" font-size="11">LEFT JOIN Alugueis a ON v.Id = a.VeiculoId AND a.DataDevolucao IS NULL</text>
  <rect x="56" y="674" width="508" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="72" y="704" fill="#334155" font-family="Segoe UI, Arial" font-size="12">[Tabela de Veiculos Disponiveis Filtrados por Categoria e Ano Minimo]</text>

  <rect x="600" y="570" width="560" height="210" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="616" y="596" fill="#1e40af" font-family="Consolas, monospace" font-size="13" font-weight="bold">GET /api/filtros/fabricantes-com-veiculos (LEFT JOIN + GROUP BY)</text>
  <text x="616" y="632" fill="#334155" font-family="Segoe UI, Arial" font-size="12">Toyota (2 veiculos)</text>
  <rect x="616" y="640" width="420" height="14" rx="7" fill="#2563eb"/>
  <text x="616" y="678" fill="#334155" font-family="Segoe UI, Arial" font-size="12">Volkswagen (2 veiculos)</text>
  <rect x="616" y="686" width="420" height="14" rx="7" fill="#2563eb"/>
  <text x="616" y="724" fill="#334155" font-family="Segoe UI, Arial" font-size="12">Honda (0 veiculos - exibido pelo LEFT JOIN)</text>
  <rect x="616" y="732" width="420" height="14" rx="7" fill="#e2e8f0"/>
</svg>
